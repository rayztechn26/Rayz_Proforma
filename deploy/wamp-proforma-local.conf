# Local WAMP Apache virtual host. Uses PHP 8.4 for this site only.
Listen 127.0.0.1:8087
<VirtualHost 127.0.0.1:8087>
    ServerName proforma.localhost
    DocumentRoot "C:/wamp64/www/backend/public"
    ErrorLog "C:/wamp64/logs/proforma-local-error.log"
    CustomLog "C:/wamp64/logs/proforma-local-access.log" common
    FcgidInitialEnv PHPRC "C:/wamp64/bin/php/php8.4.15"
    FcgidInitialEnv PHP_FCGI_MAX_REQUESTS 1000
    <Directory "C:/wamp64/www/backend/public">
        Options -Indexes +ExecCGI +FollowSymLinks
        AllowOverride All
        Require local
        FcgidWrapper "C:/wamp64/bin/php/php8.4.15/php-cgi.exe" .php
        <FilesMatch "\.php$">
            SetHandler fcgid-script
        </FilesMatch>
    </Directory>
</VirtualHost>
